name: Build APK do ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Extrair o ZIP
        run: |
          unzip -q LegacyStrike-Android-pronto-para-GitHub.zip -d proj
          ls -la proj

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build com Gradle
        shell: bash
        run: |
          set -o pipefail
          cd proj
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Copiar APK
        if: always()
        run: |
          mkdir -p apk
          cp proj/app/build/outputs/apk/debug/app-debug.apk apk/LegacyStrike-CS2.apk || true
          ls -la apk || true

      - name: Publicar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegacyStrike-CS2
          path: apk/*.apk
          if-no-files-found: warn

      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: warn
