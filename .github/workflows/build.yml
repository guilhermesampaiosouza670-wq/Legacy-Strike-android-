name: Build APK do ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LegacyStrike-Android-pronto-para-GitHub.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar Legacy Strike CS2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar e extrair ZIP
        id: extract
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP='LegacyStrike-Android-pronto-para-GitHub.zip'
          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Não encontrei $ZIP na raiz do repositório. Confira o nome exato do arquivo."
            echo "Arquivos disponíveis:"
            ls -lah
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          echo 'Conteúdo extraído:'
          find extracted -maxdepth 3 -type f | sort | head -100
          SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo '::error::O ZIP não contém settings.gradle. Não parece ser a raiz de um projeto Gradle Android.'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Gradle encontrado em: $PROJECT_DIR"
          for required in build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/www/index.html; do
            if [[ ! -f "$PROJECT_DIR/$required" ]]; then
              echo "::error::Arquivo obrigatório ausente: $PROJECT_DIR/$required"
              exit 1
            fi
          done

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34 e Build Tools
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Compilar APK Debug e Release
        id: gradle
        continue-on-error: true
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -uo pipefail
          : > "$GITHUB_WORKSPACE/gradle-build.log"
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          {
            echo "Diretório do projeto: $PWD"
            echo '--- Java ---'
            java -version
            echo '--- Gradle ---'
            gradle --version
            echo '--- Arquivos Gradle ---'
            ls -la
            echo '--- Compilação ---'
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Localizar e validar APKs
        id: apks
        if: always() && steps.gradle.outcome == 'success'
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -Eeuo pipefail
          BASE="$GITHUB_WORKSPACE/$PROJECT_DIR/app/build/outputs/apk"
          DEBUG="$BASE/debug/app-debug.apk"
          RELEASE="$BASE/release/app-release.apk"
          test -s "$DEBUG" || { echo '::error::APK Debug não foi encontrado.'; exit 1; }
          test -s "$RELEASE" || { echo '::error::APK Release não foi encontrado.'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "$DEBUG" "$GITHUB_WORKSPACE/apk/LegacyStrike-CS2-debug.apk"
          cp "$RELEASE" "$GITHUB_WORKSPACE/apk/LegacyStrike-CS2-release.apk"
          ls -lh "$GITHUB_WORKSPACE/apk"

      - name: Publicar APKs
        if: steps.gradle.outcome == 'success' && steps.apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LegacyStrike-CS2-APKs
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar log da compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegacyStrike-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Encerrar com erro se a compilação falhou
        if: steps.gradle.outcome != 'success' || steps.apks.outcome == 'failure'
        shell: bash
        run: |
          echo '::error::A compilação falhou. Abra o artifact LegacyStrike-build-log para ver o erro completo.'
          exit 1
