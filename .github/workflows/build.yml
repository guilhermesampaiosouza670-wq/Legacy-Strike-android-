name: Compilar Legacy Strike CS2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Legacy Strike CS2
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar e extrair ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="LegacyStrike-Android-pronto-para-GitHub.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Não encontrei $ZIP na raiz do repositório."
            ls -lah
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/proj"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/proj"

          echo "Conteúdo extraído:"
          find "$GITHUB_WORKSPACE/proj" -maxdepth 3 -type f | head -200

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/proj" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            BUILD_FILE="$(find "$GITHUB_WORKSPACE/proj" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [ -z "$BUILD_FILE" ]; then
              echo "::error::Não encontrei settings.gradle nem build.gradle dentro do ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto Android encontrado em: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Android SDK manualmente
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK não encontrado em $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não foi encontrado em $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build com Gradle
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-log"
          cd "$PROJECT_DIR"

          {
            echo "Diretório do projeto: $PROJECT_DIR"
            java -version
            gradle --version

            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
            else
              gradle assembleDebug assembleRelease --no-daemon --stacktrace
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/build-log/gradle.log"

      - name: Copiar APKs encontrados
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"
          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            find "$PROJECT_DIR" -type f -name "*.apk" -print -exec cp -f {} "$GITHUB_WORKSPACE/apk/" \; || true
          fi
          ls -lah "$GITHUB_WORKSPACE/apk" || true

      - name: Publicar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegacyStrike-CS2
          path: apk/*.apk
          if-no-files-found: warn

      - name: Publicar log de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log/
          if-no-files-found: warn
