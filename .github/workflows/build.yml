{"name":"Build APK do ZIP","on":"workflow_dispatch","jobs":{"apk":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4"},{"name":"Extrair o ZIP","run":"set -eux\nunzip -q ./*.zip -d proj\nls proj/LegacyStrike-Android"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Android SDK 34","run":"SDKM=\"$(find \"$ANDROID_HOME/cmdline-tools\" -type f -name sdkmanager | head -n 1)\"\nyes | \"$SDKM\" --licenses >/dev/null || true\n\"$SDKM\" \"platforms;android-34\" \"build-tools;34.0.0\""},{"name":"Compilar","working-directory":"proj/LegacyStrike-Android","run":"set -o pipefail\ngradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../gradle-build.log"},{"name":"Nomear APK","run":"cp proj/LegacyStrike-Android/app/build/outputs/apk/debug/app-debug.apk LegacyStrike-CS2.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"LegacyStrike-CS2","path":"LegacyStrike-CS2.apk","if-no-files-found":"error"}},{"uses":"actions/upload-artifact@v4","if":"always()","with":{"name":"build-log","path":"gradle-build.log","if-no-files-found":"ignore"}}]}}}
